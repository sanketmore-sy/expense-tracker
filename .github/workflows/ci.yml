name: CI - test, build and push images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKERHUB_USER: sanket252005

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Security audit (informational)
        run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true

  docker:
    name: Build and push Docker images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/expense-tracker-backend:latest
            ${{ env.DOCKERHUB_USER }}/expense-tracker-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/expense-tracker-frontend:latest
            ${{ env.DOCKERHUB_USER }}/expense-tracker-frontend:${{ github.sha }}

     deploy:
    name: Deploy to EC2 server
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create app.env from the MONGO_URI secret
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: printf 'PORT=3000\nMONGO_URI=%s\n' "$MONGO_URI" > deploy/app.env

      - name: Create grafana.env from the GRAFANA_PASSWORD secret
        env:
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
        run: printf 'GF_SECURITY_ADMIN_PASSWORD=%s\nGF_USERS_ALLOW_SIGN_UP=false\n' "$GRAFANA_PASSWORD" > deploy/grafana.env

      - name: Copy deployment files to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 13.201.133.106
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/*"
          target: /home/ubuntu/deploy
          strip_components: 1

      - name: Start the new version on the server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 13.201.133.106
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/deploy
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml restart prometheus
            docker image prune -f

      - name: Verify the live site is healthy
        run: |
          for i in $(seq 1 12); do
            if curl -fsS http://13.201.133.106:3000/api/health | grep -q '"db":"connected"'; then
              echo "Backend is healthy and connected to the database"
              exit 0
            fi
            echo "Not ready yet (attempt $i of 12), waiting 5 seconds..."
            sleep 5
          done
          echo "Health check FAILED"
          exit 1