services:
  backend:
    image: sanket252005/expense-tracker-backend:latest
    container_name: expense-backend
    restart: always
    env_file: app.env
    ports:
      - "3000:3000"

  frontend:
    image: sanket252005/expense-tracker-frontend:latest
    container_name: expense-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"